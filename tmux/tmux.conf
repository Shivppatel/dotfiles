set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style "fg=#565f89,bg=default"
set -g pane-border-style "fg=#292e42,bg=default"
set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# TokyoNight Night theme
set -g mode-style "fg=#7aa2f7,bg=#3b4261"
set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"
set -g status on
set -g status-interval 5
set -g status-justify "left"
set -g status-style "fg=#a9b1d6,bg=#16161e"
set -g status-left-length "100"
set -g status-right-length "120"
set -g status-left-style "none"
set -g status-right-style "none"
set -g status-left "#[fg=#7aa2f7,bg=#16161e,bold]  #S  #[fg=#3b4261,bg=#16161e]│ "
set -g status-right "#[fg=#565f89,bg=#16161e]#{b:pane_current_path} #[fg=#3b4261]│ #[fg=#7aa2f7,bold]%H:%M "
setw -g window-status-activity-style "fg=#e0af68,bg=#16161e"
setw -g window-status-separator " "
setw -g window-status-style "none,fg=#a9b1d6,bg=#16161e"
setw -g window-status-format "#[fg=#565f89,bg=#16161e]#I #[fg=#a9b1d6]#W#{?window_zoomed_flag,*,}#F"
setw -g window-status-current-format "#[fg=#15161e,bg=#7aa2f7,bold] #I #[fg=#15161e,bg=#7aa2f7,nobold]│#[fg=#15161e,bg=#7aa2f7,bold] #W#{?window_zoomed_flag,*,}#F "

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
